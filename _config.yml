# Use GitHub pages Jekyll configuration
# Launch GitHub pages Jekyll with:
# bundle exec jekyll serve

# General blog information
############################################################
# Name of your blog (this will show up at the top of your page and in the RSS feed)
title: Xinyang's Blog
name: Xinyang's Blog
# Text shown in the navbar toggle button (kept separate from `title`)
navbar_title: "昕旸's personal blog"
# Short description (goes below the title; it will also be used in the RSS feed)
description: Aggregation of notes and code samples.
# Your name, as you want it to appear underneath each post and in the footer.
# Object form so jekyll-seo-tag emits a valid twitter:creator handle.
author:
  name: Xinyang Li
  twitter: XinyangLiChem
# Your email if you want it to be linked on the contact page
author_email: toosimple@outlook.com
email: toosimple@outlook.com
# The URL of your actual domain. This will be used to make absolute links in the RSS feed.
url: https://tautomer.github.io
twitter_username: XinyangLiChem
github_username: tautomer
google_scholar: HqnNotUAAAAJ
linkedin_username: lxy-
instagram_username: ringpolymer

# Where things are
############################################################
source: . # Set by GitHub
# This is where the generated site will be placed once Jekyll is done transforming it.
destination: ./_site
#plugins_dir: ./_plugins
# This folder is for the main templates your content will be inserted into. You can have different layouts for different pages or page sections.
collections: null
asset_suffix: ".min"
assets:
  css: /assets/css
  js: /assets/js
  images: /assets/images

defaults:
  - scope:
      path: "photography"
    values:
      permalink: /:path/:basename:output_ext
# Handling Reading
############################################################
# Safe: Disable custom plugins, and ignore symbolic links.
safe: true # Set by GitHub
include: [".htaccess"]
exclude:
  - notebooks
  - build_info
keep_files:
  - ".git"
  - ".svn"
encoding: "utf-8"
markdown_ext: "markdown,mkdown,mkdn,mkd,md"

# Filtering Content
############################################################
show_drafts: null
limit_posts: 0
future: true
unpublished: false

# Plugins
############################################################
whitelist: []
plugins:
  - github-pages
  - jekyll-sitemap
  - jekyll-redirect-from
  - jekyll-seo-tag

# SEO / social sharing (jekyll-seo-tag)
############################################################
# Default preview image used for Open Graph / Twitter cards when a page
# defines no `image`. Posts can override with front-matter `image:`.
logo: /assets/images/favicon/android-icon-192x192.png
twitter:
  username: XinyangLiChem
  card: summary
social:
  name: Xinyang Li
  links:
    - https://github.com/tautomer
    - https://www.linkedin.com/in/lxy-/

# Conversion
############################################################
markdown: kramdown
highlighter: rouge
# LSI: produce an index for related posts.
lsi: false # Set by GitHub
excerpt_separator: "\n\n"

kramdown:
  auto_ids: true
  footnote_nr: 1
  entity_output: as_char
  toc_levels: 1..6
  smart_quotes: lsquo,rsquo,ldquo,rdquo
  syntax_highlighter: rouge
  math_engine: mathjax


# Serving
############################################################
detach: false
port: 4000
host: 127.0.0.1
# Uncomment if you are planning to run the blog in a subdirectory
# Note - if you enable this, and attempt to view your site locally you have to use the baseurl in your local path.
# Serve the website from the given base URL
# Example, you must use http://localhost:4000/path/to/blog
#baseurl: /path/to/blog
baseurl: "" # does not include hostname
webrick:
  headers:
    Access-Control-Allow-Origin: "*"


# Outputting
############################################################
permalink: /posts/:title/
paginate_path: /page:num
# Set the time zone for site generation.
timezone: America/New_York

quiet: false


# Analytics
############################################################
google_analytics: G-5TB54M0459