<head>
  <!-- Google Analytics -->
  {% include analytics.html %}
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <!-- The above 3 meta tags *must* come first in the head; any other head content must come *after* these tags -->
  {% include meta.html %}
  <!-- favicon -->
  {% include favicons.html %}

  <!-- Bootstrap core CSS -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.7/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-LN+7fdVzj6u52u30Kp6M/trliBMCMKTyK833zpbD+pXdCLuTusPj697FH4R/5mcr" crossorigin="anonymous">
  {% include asset_suffix.html %}
  <link rel="stylesheet" href="{{ site.assets.css }}/notebook{{ asset_suffix }}.css">
  <link rel="stylesheet" href="{{ site.assets.css }}/main{{ asset_suffix }}.css">
  <link rel="stylesheet" href="{{ site.assets.css }}/syntax{{ asset_suffix }}.css">
  <link rel="stylesheet" href="{{ site.assets.css }}/fontawesome-all.min.css">

  <!-- jQuery in header because of Bokeh -->
  <script src="https://code.jquery.com/jquery-3.7.1.min.js" integrity="sha256-/JqT3SQfawRcv/BIHPThkBvs0OEvtFFmqPF/lYI/Cxo=" crossorigin="anonymous"></script>

  {% if page.support contains 'gallery' %}
  <script src="https://unpkg.com/jquery-mousewheel@3.2.2/jquery.mousewheel.min.js"></script>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/lightgallery@2.8.3/css/lightgallery-bundle.min.css" />
  <script src="https://cdn.jsdelivr.net/npm/lightgallery@2.8.3/plugins/share/lg-share.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/lightgallery@2.8.3/plugins/rotate/lg-rotate.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/lightgallery@2.8.3/lightgallery.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/lightgallery@2.8.3/plugins/thumbnail/lg-thumbnail.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/lightgallery@2.8.3/plugins/zoom/lg-zoom.min.js"></script>
  <script src="https://unpkg.com/isotope-layout@3/dist/isotope.pkgd.min.js"></script>
  <script src="https://unpkg.com/masonry-layout@4/dist/masonry.pkgd.min.js"></script>
  <script src="https://unpkg.com/imagesloaded@5/imagesloaded.pkgd.min.js"></script>
  {% endif %}
  {% if page.support contains 'jquery' %}
  <link rel="stylesheet" href="{{ site.assets.css }}/gallery{{ asset_suffix }}.css">
  {% endif %}
</head>
