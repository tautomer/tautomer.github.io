{% comment %} Homepage gets an expanded navbar and a home icon; other pages collapse to a menu. {% endcomment %}
{% assign is_home = false %}
{% if page.url == "/" and page.path == "index.html" %}{% assign is_home = true %}{% endif %}

<nav class="navbar navbar-dark navbar-custom">
  <!-- flex-wrap allows items to wrap to the next line -->
  <div class="container-fluid flex-wrap">

    <!-- A simple back button -->
    <button class="btn btn-lg" onclick="history.back()" aria-label="Go back">
      <i class="text-secondary fa-solid fa-arrow-left"></i>
    </button>

    <!-- Navbar toggle button (use custom button) -->
    <button class="navbar-custom-toggler btn btn-outline-secondary order-0{% unless is_home %} dropdown-toggle{% endunless %}" type="button"
      data-bs-toggle="collapse" data-bs-target="#menuButton" aria-controls="menuButton" aria-expanded="false"
      aria-label="Toggle navigation">
      <span class="fa-solid {% if is_home %}fa-home{% else %}fa-bars{% endif %}"></span>&nbsp;&nbsp; {{ site.navbar_title }}
    </button>

    <!--
      w-100 to force this div to take 100% width, making it wrap to a new line.
      navbar-expand-on-homepage class is used to force expand the navbar on the homepage.
    -->
    <div class="collapse navbar-collapse w-100 {% if is_home %}navbar-expand-on-homepage{% endif %} order-3" id="menuButton">
      <!-- Inside collapse of navbar -->
      <div class="d-grid gap-2 d-md-block">
        <!-- Use custom buttons for navbar collapsable content -->
        <a href="/" class="nav-item btn btn-lg btn-outline-success navbar-custom-button"><span
            class="fa-solid fa-house"></span> Home</a>
        <a href="/tag_index" class="nav-item btn btn-lg btn-outline-tags navbar-custom-button"><span
            class="fa-solid fa-tags"></span> Tags</a>
        <a href="/posts_chrono" class="nav-item btn btn-lg btn-outline-primary navbar-custom-button"><span
            class="fa-solid fa-newspaper"></span> Posts</a>
        <a href="/photography" class="nav-item btn btn-lg btn-outline-gallery navbar-custom-button"><span
            class="fa-solid fa-camera-retro"></span> Gallery</a>
        <a href="/projects" class="nav-item btn btn-lg btn-outline-info navbar-custom-button"><span
            class="fa-solid fa-bars-progress"></span> Projects</a>
        <a href="/about" class="nav-item btn btn-lg btn-outline-about navbar-custom-button"><span
            class="fa-solid fa-address-card"></span> About</a>
      </div>
    </div>

    <!-- Hyperlinks on the right hand side -->
    <div class="order-1 navbar-social">
      <div class="d-flex gap-2">
        <a href="https://www.linkedin.com/in/{{ site.linkedin_username }}/" target="_blank" rel="noopener" class="btn btn-lg" aria-label="LinkedIn"><i
            class="text-secondary fa-brands fa-linkedin fa-lg"></i></a>
        <a href="https://github.com/{{ site.github_username }}" target="_blank" rel="noopener" class="btn btn-lg" aria-label="GitHub"><i
            class="text-secondary fa-brands fa-github fa-lg"></i></a>
        <a href="https://scholar.google.com/citations?hl=en&user={{ site.google_scholar }}&view_op=list_works&sortby=pubdate"
          target="_blank" rel="noopener" class="btn btn-lg" aria-label="Google Scholar"><i class="text-secondary fa-brands fa-google-scholar fa-lg"></i></a>
        <a href="https://www.instagram.com/{{ site.instagram_username }}/" target="_blank" rel="noopener" class="btn btn-lg" aria-label="Instagram"><i
            class="text-secondary fa-brands fa-instagram fa-lg"></i></a>
        <a href="mailto:{{ site.email }}" class="btn btn-lg" aria-label="Email"><i
            class="text-secondary fa-solid fa-envelope fa-lg"></i></a>
      </div>
    </div>

  </div>
</nav>
